# Nasazení produkce na Vercel po pushi na main.
#
# Nastavení (jednorázově v GitHubu → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        — https://vercel.com/account/tokens
#   VERCEL_ORG_ID       — z .vercel/project.json po `vercel link` (nebo z nastavení projektu)
#   VERCEL_PROJECT_ID   — totéž
#
# Pokud máš v projektu na Vercelu zapnuté „Automatic deployments from Git“,
# můžeš buď tento workflow nepoužívat (stačí propojení repo), nebo v Vercelu
# vypnout automatické buildy z Gitu, aby se nespouštěly dvakrát.

name: Vercel — production

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
